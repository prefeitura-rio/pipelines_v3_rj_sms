name: Register flows (staging)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pipeline_filter:
        description: "Diretório sob o qual todos os flows terão deploy"
        required: false
        type: string
        default: ""
      debug:
        description: "Habilita logs de debug"
        required: false
        type: boolean
        default: false

# [Ref] https://ashishb.net/programming/common-pitfalls-of-github-actions/
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-flow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'staging/') ||
      contains(toJson(github.event.pull_request.labels), '"name": "staging"')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Deploy Prefect flows
        uses: ./.github/actions/deploy-prefect-flows
        with:
          environment: dev
          debug: ${{ inputs.debug }}
          pipeline_filter: ${{ inputs.pipeline_filter }}

          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_WS_AUTH: ${{ secrets.PREFECT_WS_AUTH }}

          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          INFISICAL_ADDRESS: ${{ secrets.INFISICAL_ADDRESS }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
